<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Distinct-Slope Dot Grid (Responsive)</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: white; /* keep white background */
      font-family: sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Container fills whole space */
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      background: #fafafa;
      border: 2px solid #555;
      border-radius: 12px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      touch-action: manipulation;
    }

    /* Keep UI fixed at the top like before */
    #ui {
      position: absolute;
      top: 10px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      box-sizing: border-box;
      color: #222;
      font-size: 14px;
    }

    select, button {
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #aaa;
      background: #f7f7f7;
      cursor: pointer;
    }

    #winMsg {
      color: green;
      font-weight: 600;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div id="root">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
      <div>
        Grid:
        <select id="gridSizeSelect">
          <option value="2">2×2</option>
          <option value="3">3×3</option>
          <option value="4">4×4</option>
          <option value="5" selected>5×5</option>
          <option value="6">6×6</option>
          <option value="7">7×7</option>
          <option value="8">8×8</option>
          <option value="9">9×9</option>
          <option value="10">10×10</option>
        </select>
        <button id="resetBtn">Start / Reset</button>
      </div>
      <div>
        Selected: <span id="count">0</span> /
        <span id="maxPossible">?</span> <span id="winMsg"></span>
      </div>
    </div>
  </div>

  <script>
    let gridSize = 5;
    let sizePx = 400;
    let margin = 40;
    let dotRadius = 8;
    let cellSize;
    let gridCoords = [];
    let selected = [];
    let usedSlopes = new Set();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const countSpan = document.getElementById('count');
    const maxSpan = document.getElementById('maxPossible');
    const winMsg = document.getElementById('winMsg');
    const gridSizeSelect = document.getElementById('gridSizeSelect');
    const resetBtn = document.getElementById('resetBtn');

    function gcd(a,b){
      a = Math.abs(a); b = Math.abs(b);
      while (b) [a,b] = [b, a % b];
      return a;
    }
    function computeSlope(i1,j1,i2,j2){
      const dx = j2 - j1;
      const dy = i1 - i2;
      if (dx === 0) return 'inf';
      const g = gcd(dy, dx);
      let rDy = dy/g, rDx = dx/g;
      if (rDx < 0){ rDx = -rDx; rDy = -rDy; }
      return `${rDy}/${rDx}`;
    }

    function updateInfo(){
      countSpan.textContent = selected.length;
      maxSpan.textContent = gridSize + 1;
      winMsg.textContent = selected.length === gridSize + 1 ? "Complete!" : "";
    }

    function drawAll(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawGrid();
      drawConnections();
      drawSelected();
    }
    function drawGrid(){
      ctx.fillStyle = '#333';
      for(let i=0;i<gridSize;i++){
        for(let j=0;j<gridSize;j++){
          const {x,y} = gridCoords[i][j];
          ctx.beginPath();
          ctx.arc(x,y,dotRadius,0,Math.PI*2);
          ctx.fill();
        }
      }
    }
    function drawConnections(){
      if(selected.length<2) return;
      ctx.strokeStyle = '#999';
      ctx.lineWidth = Math.max(1,sizePx*0.004);
      for(let a=0;a<selected.length;a++){
        for(let b=a+1;b<selected.length;b++){
          const A=selected[a], B=selected[b];
          const p1=gridCoords[A.i][A.j], p2=gridCoords[B.i][B.j];
          ctx.beginPath();
          ctx.moveTo(p1.x,p1.y);
          ctx.lineTo(p2.x,p2.y);
          ctx.stroke();
        }
      }
    }
    function drawSelected(){
      ctx.fillStyle = '#007acc';
      for(let {i,j} of selected){
        const {x,y}=gridCoords[i][j];
        ctx.beginPath();
        ctx.arc(x,y,dotRadius,0,Math.PI*2);
        ctx.fill();
      }
    }

    function blinkInvalid(i,j){
      const {x,y}=gridCoords[i][j];
      ctx.fillStyle='red';
      ctx.beginPath();
      ctx.arc(x,y,dotRadius+2,0,Math.PI*2);
      ctx.fill();
      setTimeout(drawAll,150);
    }

    function removeSelection(i,j){
      selected=selected.filter(p=>!(p.i===i && p.j===j));
      usedSlopes.clear();
      for(let a=0;a<selected.length;a++)
        for(let b=a+1;b<selected.length;b++)
          usedSlopes.add(computeSlope(selected[a].i,selected[a].j,selected[b].i,selected[b].j));
    }

    function canAdd(i,j){
      for(let pt of selected)
        if(usedSlopes.has(computeSlope(pt.i,pt.j,i,j))) return false;
      return true;
    }

    function layoutCanvas(){
      const W=window.innerWidth, H=window.innerHeight;
      sizePx=Math.floor(Math.min(W,H)*0.9);
      const dpr=Math.max(1,window.devicePixelRatio||1);
      canvas.width=sizePx*dpr;
      canvas.height=sizePx*dpr;
      canvas.style.width=sizePx+'px';
      canvas.style.height=sizePx+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);

      margin=sizePx*0.08;
      dotRadius=Math.max(4,Math.round(sizePx*0.02));
      cellSize=(sizePx-2*margin)/(gridSize-1);

      gridCoords=Array.from({length:gridSize},(_,i)=>
        Array.from({length:gridSize},(_,j)=>({
          x:margin+j*cellSize,
          y:margin+i*cellSize
        }))
      );
    }

    function initGame(){
      gridSize=parseInt(gridSizeSelect.value);
      layoutCanvas();
      selected=[];
      usedSlopes.clear();
      updateInfo();
      drawAll();
    }

    canvas.addEventListener('click',evt=>{
      const rect=canvas.getBoundingClientRect();
      const x=evt.clientX-rect.left, y=evt.clientY-rect.top;
      for(let i=0;i<gridSize;i++){
        for(let j=0;j<gridSize;j++){
          const {x:dx,y:dy}=gridCoords[i][j];
          if(Math.hypot(x-dx,y-dy)<=dotRadius+6){
            if(selected.some(p=>p.i===i && p.j===j)){
              removeSelection(i,j);
            } else if(!canAdd(i,j)){
              blinkInvalid(i,j);
            } else {
              for(let pt of selected)
                usedSlopes.add(computeSlope(pt.i,pt.j,i,j));
              selected.push({i,j});
            }
            updateInfo();
            drawAll();
            return;
          }
        }
      }
    });

    window.addEventListener('resize',()=>{
      layoutCanvas();
      drawAll();
    });

    gridSizeSelect.addEventListener('change',initGame);
    resetBtn.addEventListener('click',initGame);

    window.addEventListener('load',initGame);
  </script>
</body>
</html>
