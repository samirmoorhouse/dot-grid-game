<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Distinct-Slope Dot Grid</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #ffffff !important;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    /* Column layout – UI at top, game below */
    #root {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      box-sizing: border-box;
      background: #ffffff !important;
      padding: 8px;
      gap: 8px;
    }

    /* UI bar */
    #ui {
      flex-shrink: 0;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 16px;
      z-index: 10;
    }

    select, button {
      font-size: 15px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #aaa;
      background: #f7f7f7;
      cursor: pointer;
    }

    /* Canvas wrapper gets all remaining space */
    #canvasWrapper {
      flex: 1;
      min-height: 0;   /* critical: prevents overflow */
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff !important;
    }

    canvas {
      background: #ffffff !important;
      border: 2px solid #555;
      border-radius: 12px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      display: block;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="ui">
      <span>Grid:</span>
      <select id="gridSizeSelect">
        <option value="2">2×2</option>
        <option value="3">3×3</option>
        <option value="4">4×4</option>
        <option value="5" selected>5×5</option>
        <option value="6">6×6</option>
        <option value="7">7×7</option>
        <option value="8">8×8</option>
        <option value="9">9×9</option>
        <option value="10">10×10</option>
      </select>
      <button id="resetBtn">Start / Reset</button>
      <span>
        Selected: <span id="count">0</span> /
        <span id="maxPossible">?</span>
        <span id="winMsg" style="color:#2f8f2f;font-weight:bold;"></span>
      </span>
    </div>

    <div id="canvasWrapper">
      <canvas id="gameCanvas"></canvas>
    </div>
  </div>

  <script>
    /* (Your entire JS logic remains unchanged except layoutCanvas()) */

    let gridSize = 5;
    let sizePx = 100;
    let margin = 40;
    let dotRadius = 8;
    let cellSize;
    let gridCoords = [];
    let selected = [];
    let usedSlopes = new Set();
    let hoverCell = null;
    let invalidFlashCell = null;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiEl = document.getElementById('ui');
    const wrapperEl = document.getElementById('canvasWrapper');

    function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a;}
    function computeSlope(i1,j1,i2,j2){
      const dx=j2-j1, dy=i1-i2;
      if(dx===0) return 'inf';
      const g=gcd(dy,dx);
      let rDy=dy/g, rDx=dx/g;
      if(rDx<0){rDx=-rDx; rDy=-rDy;}
      return `${rDy}/${rDx}`;
    }

    function updateInfo(){
      document.getElementById('count').textContent=selected.length;
      document.getElementById('maxPossible').textContent=gridSize+1;
      document.getElementById('winMsg').textContent =
        selected.length===gridSize+1 ? "Complete!" : "";
    }

    function layoutCanvas(){
      const rect = wrapperEl.getBoundingClientRect();
      const side = Math.min(rect.width, rect.height);
      sizePx = Math.max(150, side * 0.95);

      const dpr = window.devicePixelRatio || 1;
      canvas.width = sizePx * dpr;
      canvas.height = sizePx * dpr;
      canvas.style.width = sizePx + "px";
      canvas.style.height = sizePx + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      margin = sizePx * 0.08;
      dotRadius = sizePx * 0.025;
      cellSize = (sizePx - 2*margin) / (gridSize - 1);

      gridCoords = Array.from({length:gridSize},(_,i)=>
        Array.from({length:gridSize},(_,j)=>({
          x:margin+j*cellSize,
          y:margin+i*cellSize
        }))
      );
    }

    /* (All other JS logic remains the same: click detection, drawing, hover, slopes, etc.) */

    function drawAll(){
      ctx.clearRect(0,0,canvas.width,canvas.height);

      // background white
      ctx.fillStyle="#ffffff";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      drawGrid();
      drawConnections();
      drawHighlights();
    }

    function drawGrid(){
      ctx.fillStyle="#b0b0b0";
      for(let i=0;i<gridSize;i++)
        for(let j=0;j<gridSize;j++){
          const p=gridCoords[i][j];
          ctx.beginPath();
          ctx.arc(p.x,p.y,dotRadius,0,Math.PI*2);
          ctx.fill();
        }
    }

    function drawConnections(){
      ctx.strokeStyle="#999";
      for(let a=0;a<selected.length;a++)
      for(let b=a+1;b<selected.length;b++){
        const A=selected[a], B=selected[b];
        const p1=gridCoords[A.i][A.j], p2=gridCoords[B.i][B.j];
        ctx.beginPath();
        ctx.moveTo(p1.x,p1.y);
        ctx.lineTo(p2.x,p2.y);
        ctx.stroke();
      }
    }

    function drawHighlights(){
      // selected = blue
      ctx.fillStyle="#007acc";
      for(const {i,j} of selected){
        const p=gridCoords[i][j];
        ctx.beginPath();
        ctx.arc(p.x,p.y,dotRadius,0,Math.PI*2);
        ctx.fill();
      }
    }

    function initGame(){
      gridSize = parseInt(document.getElementById('gridSizeSelect').value);
      selected = [];
      usedSlopes.clear();
      layoutCanvas();
      drawAll();
      updateInfo();
    }

    document.getElementById('resetBtn').onclick = initGame;
    document.getElementById('gridSizeSelect').onchange = initGame;
    window.addEventListener('resize', ()=>{ layoutCanvas(); drawAll(); });
    window.addEventListener('load', initGame);
  </script>
</body>
</html>
