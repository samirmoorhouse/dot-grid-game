<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Distinct-Slope Dot Grid</title>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;          /* avoid scrollbars */
      background: #ffffff;       /* white background */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      user-select: none;
      -webkit-user-select: none;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* extra safety */
      box-sizing: border-box;
    }

    canvas {
      display: block;
      background: #fafafa;
      border: 2px solid #555;
      border-radius: 12px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      touch-action: manipulation;
    }

    /* Floating UI bar at the top, more readable */
    #ui {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 16px);
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      box-sizing: border-box;
      color: #222;
      font-size: 15px;
      background: rgba(255,255,255,0.95);
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    }

    #ui-left, #ui-right {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    select, button {
      font-size: 15px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #aaa;
      background: #f7f7f7;
      cursor: pointer;
    }

    select:focus, button:focus {
      outline: 2px solid #007acc;
      outline-offset: 1px;
    }

    #winMsg {
      color: #2f8f2f;
      font-weight: 600;
      margin-left: 4px;
    }

    @media (max-width: 600px) {
      #ui {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px 8px;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
      <div id="ui-left">
        <span>Grid:</span>
        <select id="gridSizeSelect">
          <option value="2">2×2</option>
          <option value="3">3×3</option>
          <option value="4">4×4</option>
          <option value="5" selected>5×5</option>
          <option value="6">6×6</option>
          <option value="7">7×7</option>
          <option value="8">8×8</option>
          <option value="9">9×9</option>
          <option value="10">10×10</option>
        </select>
        <button id="resetBtn">Start / Reset</button>
      </div>
      <div id="ui-right">
        <span>Selected: <span id="count">0</span> / <span id="maxPossible">?</span></span>
        <span id="winMsg"></span>
      </div>
    </div>
  </div>

  <script>
    let gridSize = 5;
    let sizePx = 400;
    let margin = 40;
    let dotRadius = 8;
    let cellSize;
    let gridCoords = [];
    let selected = [];
    let usedSlopes = new Set();

    let hoverCell = null;
    let invalidFlashCell = null;
    let invalidFlashTimeout = null;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const countSpan = document.getElementById('count');
    const maxSpan = document.getElementById('maxPossible');
    const winMsg = document.getElementById('winMsg');
    const gridSizeSelect = document.getElementById('gridSizeSelect');
    const resetBtn = document.getElementById('resetBtn');

    // --- maths helpers (unchanged game logic) ---
    function gcd(a, b) {
      a = Math.abs(a); b = Math.abs(b);
      while (b) [a, b] = [b, a % b];
      return a;
    }

    function computeSlope(i1, j1, i2, j2) {
      const dx = j2 - j1;
      const dy = i1 - i2;
      if (dx === 0) return 'inf';
      const g = gcd(dy, dx);
      let rDy = dy / g, rDx = dx / g;
      if (rDx < 0) { rDx = -rDx; rDy = -rDy; }
      return `${rDy}/${rDx}`;
    }

    // --- UI info ---
    function updateInfo() {
      countSpan.textContent = selected.length;
      maxSpan.textContent = gridSize + 1;
      winMsg.textContent = (selected.length === gridSize + 1) ? "Complete!" : "";
    }

    // --- drawing ---
    function drawAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawConnections();
      drawHighlights();
    }

    function drawGrid() {
      ctx.fillStyle = '#b0b0b0';   // grey dots by default
      for (let i = 0; i < gridSize; i++) {
        for (let j = 0; j < gridSize; j++) {
          const { x, y } = gridCoords[i][j];
          ctx.beginPath();
          ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawConnections() {
      if (selected.length < 2) return;
      ctx.strokeStyle = '#999';
      ctx.lineWidth = Math.max(1, sizePx * 0.004);
      for (let a = 0; a < selected.length; a++) {
        for (let b = a + 1; b < selected.length; b++) {
          const A = selected[a], B = selected[b];
          const p1 = gridCoords[A.i][A.j], p2 = gridCoords[B.i][B.j];
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
    }

    function drawHighlights() {
      // Selected points: solid blue
      ctx.fillStyle = '#007acc';
      for (const { i, j } of selected) {
        const { x, y } = gridCoords[i][j];
        ctx.beginPath();
        ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Hover preview (changes colour based on validity)
      if (hoverCell) {
        const { i, j } = hoverCell;
        const alreadySelected = selected.some(p => p.i === i && p.j === j);
        if (!alreadySelected) {
          const { x, y } = gridCoords[i][j];
          const invalid = !canAdd(i, j);
          ctx.fillStyle = invalid ? '#d9534f' : '#007acc'; // red if invalid, blue if valid
          ctx.beginPath();
          ctx.arc(x, y, dotRadius + 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Brief red flash after an invalid click
      if (invalidFlashCell) {
        const { i, j } = invalidFlashCell;
        const { x, y } = gridCoords[i][j];
        ctx.fillStyle = '#d9534f';
        ctx.beginPath();
        ctx.arc(x, y, dotRadius + 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function blinkInvalid(i, j) {
      invalidFlashCell = { i, j };
      if (invalidFlashTimeout) clearTimeout(invalidFlashTimeout);
      drawAll();
      invalidFlashTimeout = setTimeout(() => {
        invalidFlashCell = null;
        drawAll();
      }, 180);
    }

    // --- game logic helpers ---
    function removeSelection(i, j) {
      selected = selected.filter(p => !(p.i === i && p.j === j));
      usedSlopes.clear();
      for (let a = 0; a < selected.length; a++) {
        for (let b = a + 1; b < selected.length; b++) {
          usedSlopes.add(
            computeSlope(selected[a].i, selected[a].j, selected[b].i, selected[b].j)
          );
        }
      }
    }

    function canAdd(i, j) {
      for (let pt of selected) {
        if (usedSlopes.has(computeSlope(pt.i, pt.j, i, j))) return false;
      }
      return true;
    }

    // --- layout / sizing ---
    function layoutCanvas() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      sizePx = Math.floor(Math.min(W, H) * 0.9); // responsive

      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = sizePx * dpr;
      canvas.height = sizePx * dpr;
      canvas.style.width = sizePx + 'px';
      canvas.style.height = sizePx + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      margin = sizePx * 0.08;
      dotRadius = Math.max(4, Math.round(sizePx * 0.02));
      cellSize = (sizePx - 2 * margin) / (gridSize - 1);

      gridCoords = Array.from({ length: gridSize }, (_, i) =>
        Array.from({ length: gridSize }, (_, j) => ({
          x: margin + j * cellSize,
          y: margin + i * cellSize
        }))
      );
    }

    function initGame() {
      gridSize = parseInt(gridSizeSelect.value, 10);
      layoutCanvas();
      selected = [];
      usedSlopes.clear();
      hoverCell = null;
      invalidFlashCell = null;
      if (invalidFlashTimeout) {
        clearTimeout(invalidFlashTimeout);
        invalidFlashTimeout = null;
      }
      updateInfo();
      drawAll();
    }

    // --- input handling ---
    function getCellFromEvent(evt) {
      const rect = canvas.getBoundingClientRect();
      const x = evt.clientX - rect.left;
      const y = evt.clientY - rect.top;

      for (let i = 0; i < gridSize; i++) {
        for (let j = 0; j < gridSize; j++) {
          const { x: dx, y: dy } = gridCoords[i][j];
          if (Math.hypot(x - dx, y - dy) <= dotRadius + 8) {
            return { i, j };
          }
        }
      }
      return null;
    }

    canvas.addEventListener('click', evt => {
      const cell = getCellFromEvent(evt);
      if (!cell) return;

      const { i, j } = cell;

      if (selected.some(p => p.i === i && p.j === j)) {
        removeSelection(i, j);
      } else if (!canAdd(i, j)) {
        blinkInvalid(i, j); // red flash for impossible choice
      } else {
        for (let pt of selected) {
          usedSlopes.add(computeSlope(pt.i, pt.j, i, j));
        }
        selected.push({ i, j });
      }

      updateInfo();
      drawAll();
    });

    canvas.addEventListener('mousemove', evt => {
      const cell = getCellFromEvent(evt);
      if (!cell && !hoverCell) return;

      if (
        cell &&
        hoverCell &&
        cell.i === hoverCell.i &&
        cell.j === hoverCell.j
      ) {
        return; // nothing changed
      }

      hoverCell = cell;
      drawAll();
    });

    canvas.addEventListener('mouseleave', () => {
      hoverCell = null;
      drawAll();
    });

    window.addEventListener('resize', () => {
      layoutCanvas();
      drawAll();
    });

    gridSizeSelect.addEventListener('change', initGame);
    resetBtn.addEventListener('click', initGame);

    window.addEventListener('load', initGame);
  </script>
</body>
</html>
