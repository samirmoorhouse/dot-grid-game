<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Distinct‐Slope Dot Grid</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 10px;
    }

    #controls {
      margin-bottom: 10px;
      font-size: 1em;
    }

    /* Make canvas responsive and centered */
    #canvasContainer {
      width: 90vw;
      max-width: 500px;
      margin: 0 auto;
      position: relative;
    }

    #gameCanvas {
      width: 100%;
      height: auto;
      border: 1px solid #444;
      background-color: #fafafa;
      cursor: pointer;
      touch-action: manipulation;
      display: block;
    }

    #info {
      margin-top: 10px;
      font-size: 1.1em;
    }

    #winMsg {
      margin-top: 8px;
      font-size: 1.3em;
      color: green;
      font-weight: bold;
    }

    #resetBtn {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <h2>Pick as Many Dots as You Can (No Two Slopes the Same)</h2>

  <div id="controls">
    <label for="gridSizeSelect">Grid Size:&nbsp;</label>
    <select id="gridSizeSelect">
      <option value="2">2 × 2</option>
      <option value="3">3 × 3</option>
      <option value="4">4 × 4</option>
      <option value="5" selected>5 × 5</option>
      <option value="6">6 × 6</option>
      <option value="7">7 × 7</option>
      <option value="8">8 × 8</option>
      <option value="9">9 × 9</option>
      <option value="10">10 × 10</option>
    </select>
    &nbsp;&nbsp;
    <button id="resetBtn">Start / Reset</button>
  </div>

  <div id="canvasContainer">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="info">
    Selected: <span id="count">0</span> /
    <span id="maxPossible">?</span> dots
  </div>
  <div id="winMsg"></div>

  <script>
    let gridSize = 5;
    let margin, dotRadius, cellSize;
    let gridCoords = [];
    let selected = [];
    let usedSlopes = new Set();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const countSpan = document.getElementById('count');
    const maxSpan   = document.getElementById('maxPossible');
    const winMsgDiv = document.getElementById('winMsg');
    const gridSizeSelect = document.getElementById('gridSizeSelect');
    const resetBtn = document.getElementById('resetBtn');

    function gcd(a, b) {
      a = Math.abs(a); b = Math.abs(b);
      while (b !== 0) [a, b] = [b, a % b];
      return a;
    }

    function computeSlope(i1, j1, i2, j2) {
      const dx = j2 - j1;
      const dy = i1 - i2;
      if (dx === 0) return 'inf';
      let g = gcd(dy, dx);
      let rDy = dy / g, rDx = dx / g;
      if (rDx < 0) { rDx = -rDx; rDy = -rDy; }
      return `${rDy}/${rDx}`;
    }

    function updateInfo() {
      countSpan.textContent = selected.length;
      maxSpan.textContent = gridSize + 1;
      winMsgDiv.textContent = (selected.length === gridSize + 1) ? "Complete!" : "";
    }

    function drawAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawConnectionLines();
      drawSelected();
    }

    function drawGrid() {
      ctx.fillStyle = '#555';
      for (let i=0; i<gridSize; i++) {
        for (let j=0; j<gridSize; j++) {
          const {x,y} = gridCoords[i][j];
          ctx.beginPath();
          ctx.arc(x, y, dotRadius, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }

    function drawConnectionLines() {
      if (selected.length < 2) return;
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 2;
      for (let a = 0; a < selected.length; a++) {
        for (let b = a + 1; b < selected.length; b++) {
          const A = selected[a], B = selected[b];
          const p1 = gridCoords[A.i][A.j], p2 = gridCoords[B.i][B.j];
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
    }

    function drawSelected() {
      ctx.fillStyle = '#0b72b9';
      for (let {i,j} of selected) {
        const {x,y} = gridCoords[i][j];
        ctx.beginPath();
        ctx.arc(x, y, dotRadius, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function blinkInvalid(i, j) {
      const {x,y} = gridCoords[i][j];
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.arc(x, y, dotRadius+2, 0, Math.PI*2);
      ctx.fill();
      setTimeout(drawAll, 150);
    }

    function removeSelection(i, j) {
      const idx = selected.findIndex(pt => pt.i===i && pt.j===j);
      if (idx===-1) return;
      selected.splice(idx,1);
      usedSlopes.clear();
      for (let a=0; a<selected.length; a++) {
        for (let b=a+1; b<selected.length; b++) {
          const A=selected[a], B=selected[b];
          usedSlopes.add(computeSlope(A.i,A.j,B.i,B.j));
        }
      }
    }

    function canAdd(i, j) {
      for (let {i:ii,j:jj} of selected) {
        if (usedSlopes.has(computeSlope(ii,jj,i,j))) return false;
      }
      return true;
    }

    function resizeCanvas() {
      const w = canvas.clientWidth;
      canvas.width = w;
      canvas.height = w;
    }

    function initGame() {
      gridSize = parseInt(gridSizeSelect.value, 10);
      resizeCanvas();

      // dynamic scaling for any screen
      const canvasSize = canvas.width;
      margin = canvasSize * 0.08; // proportional margin
      dotRadius = Math.max(4, canvasSize * 0.015); // scale dots
      cellSize = (canvasSize - 2*margin) / (gridSize - 1);

      gridCoords = Array.from({length: gridSize}, (_, i) =>
        Array.from({length: gridSize}, (_, j) => ({
          x: margin + j*cellSize,
          y: margin + i*cellSize
        }))
      );

      selected = [];
      usedSlopes.clear();
      updateInfo();
      drawAll();
    }

    canvas.addEventListener('click', evt => {
      const rect = canvas.getBoundingClientRect();
      const clickX = evt.clientX - rect.left;
      const clickY = evt.clientY - rect.top;
      for (let i=0; i<gridSize; i++) {
        for (let j=0; j<gridSize; j++) {
          const {x,y} = gridCoords[i][j];
          if (Math.hypot(clickX-x, clickY-y) <= dotRadius+3) {
            if (selected.some(pt => pt.i===i && pt.j===j)) {
              removeSelection(i,j);
              updateInfo();
              drawAll();
              return;
            }
            if (!canAdd(i,j)) {
              blinkInvalid(i,j);
            } else {
              selected.forEach(pt => usedSlopes.add(computeSlope(pt.i,pt.j,i,j)));
              selected.push({i,j});
              updateInfo();
              drawAll();
            }
            return;
          }
        }
      }
    });

    resetBtn.addEventListener('click', initGame);
    gridSizeSelect.addEventListener('change', initGame);
    window.addEventListener('resize', initGame);
    window.addEventListener('load', initGame);
  </script>
</body>
</html>
